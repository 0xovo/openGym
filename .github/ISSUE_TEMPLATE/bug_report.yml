name: Bug report
description: Something in openGym is broken or not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Where does it happen?
      options:
        - iPhone or iPad app (App Store or TestFlight)
        - Apple Watch app
        - Android app (APK)
        - Android app (Google Play)
        - Browser, on my own server (docker compose, Helm, Nix...)
        - Browser, on someone else's instance
        - The demo on opengym.ch
        - Frontend dev server (npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: openGym version
      description: Settings, About & updates, Version. On a server, the image tag works too.
      placeholder: e.g. 1.4.2
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Device, OS and browser
      placeholder: e.g. iPhone 15 on iOS 26, Pixel 8 on Android 16, Firefox 140 on Windows
    validations:
      required: true

  - type: checkboxes
    id: passkey
    attributes:
      label: Is this about login / passkeys?
      description: >
        Most login issues are an `RP_ID`/`ORIGIN` mismatch. Check your `.env` against the
        domain you're accessing openGym from before reporting. See the
        [self-hosting guide](../../docs/SELF_HOSTING.md).
      options:
        - label: Yes, this is a login/passkey issue and I've already checked RP_ID/ORIGIN
